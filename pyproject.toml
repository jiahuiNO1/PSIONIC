[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psionic"
version = "0.1.0"
description = "Chromatin-informed multitask learning of cell-type-specific TF regulatory programs from single-cell multiome data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jiahui Hou", email = "jih325@pitt.edu" },
    { name = "Parham Hadikhani" },
    { name = "Hatice U. Osmanbeyoglu", email = "osmanbeyogluhu@pitt.edu" },
]
license = "MIT"
keywords = ["single-cell", "scATAC-seq", "scRNA-seq", "transcription factor", "multitask learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.12",
    "pandas>=2.2",
    "anndata>=0.12",
    "scanpy>=1.11",
    "pyranges==0.0.111",
    "ruamel.yaml>=0.17",
    "psutil>=5.9",
    "joblib>=1.3",
    "tqdm>=4.66",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
tutorials = ["jupyter", "session-info"]
dev = ["pytest>=7", "nbstripout"]

[project.urls]
Homepage = "https://github.com/jiahuiNO1/PSIONIC"
Issues = "https://github.com/jiahuiNO1/PSIONIC/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psionic = ["conf/*.yml", "conf/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
